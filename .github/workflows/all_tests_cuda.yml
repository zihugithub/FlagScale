name: cuda_tests

on:
  push:
    branches: [auto-build-image]
  pull_request:
    branches: ["main"]
  # Auto-trigger after build_image_cuda completes successfully
  workflow_run:
    workflows: ["Build Docker Images - CUDA"]
    types: [completed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.actor }}
  cancel-in-progress: true

jobs:
  run_tests:
    # Skip if triggered by a failed build workflow
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    # Package manager and environment settings are read from .github/configs/cuda.yml
    uses: ./.github/workflows/all_tests_common.yml
    with:
      platform: cuda

  all_tests:
    needs: run_tests
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify workflow status
        run: |
          if [ "${{ needs.run_tests.result }}" != "success" ]; then
            echo "❌ Tests workflow failed"
            exit 1
          fi
          echo "✅ All tests passed!"
