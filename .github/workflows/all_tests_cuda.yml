name: cuda_tests

on:
  push:
    branches: ["auto-build-image"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.actor }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Gate: decide whether to run tests now or wait for image build
  #
  # 1. Check if "Build Docker Images - CUDA" is running for this commit
  #    (poll for up to ~2 min to allow it to start)
  # 2. If found  → wait for it to complete (up to 30 min)
  #      - succeeded → run tests
  #      - failed/cancelled/timeout → skip tests
  # 3. If not found → run tests immediately
  # ---------------------------------------------------------------------------
  wait_for_image_build:
    name: Check image build dependency
    runs-on: ubuntu-latest
    outputs:
      should_test: ${{ steps.check.outputs.should_test }}
    steps:
      - name: Check and wait for image build if needed
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Always use github.sha — for push events it's the pushed commit;
          # for pull_request events it's the merge commit, which matches the
          # head_sha recorded by GitHub on the build workflow run.
          HEAD_SHA="${{ github.sha }}"

          # ── Phase 1: detect whether the build workflow was triggered ──
          DETECT_INTERVAL=30
          DETECT_MAX=8   # up to ~4 minutes

          BUILD_FOUND=false
          for i in $(seq 1 $DETECT_MAX); do
            RUN_INFO=$(gh run list \
              --workflow=build_image_cuda.yml \
              --commit="$HEAD_SHA" \
              --json status,conclusion \
              --jq '.[0]' 2>/dev/null || echo '{}')

            STATUS=$(echo "$RUN_INFO" | jq -r '.status // "not_found"')

            if [ "$STATUS" != "not_found" ]; then
              BUILD_FOUND=true
              echo "Build Docker Images - CUDA detected (status: $STATUS) for SHA $HEAD_SHA"
              break
            fi

            if [ "$i" -lt "$DETECT_MAX" ]; then
              echo "Build workflow not found yet — checking again in ${DETECT_INTERVAL}s ($i/$DETECT_MAX)"
              sleep $DETECT_INTERVAL
            fi
          done

          if [ "$BUILD_FOUND" = "false" ]; then
            echo "No Build Docker Images - CUDA workflow found — running tests immediately"
            echo "should_test=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # ── Phase 2: wait for the build workflow to complete ──
          WAIT_INTERVAL=60
          WAIT_MAX=360   # up to ~360 minutes

          for i in $(seq 1 $WAIT_MAX); do
            RUN_INFO=$(gh run list \
              --workflow=build_image_cuda.yml \
              --commit="$HEAD_SHA" \
              --json status,conclusion \
              --jq '.[0]' 2>/dev/null || echo '{}')

            STATUS=$(echo "$RUN_INFO" | jq -r '.status // "not_found"')
            CONCLUSION=$(echo "$RUN_INFO" | jq -r '.conclusion // ""')

            if [ "$STATUS" = "completed" ]; then
              if [ "$CONCLUSION" = "success" ]; then
                echo "Build Docker Images - CUDA succeeded — running tests"
                echo "should_test=true" >> $GITHUB_OUTPUT
              else
                echo "Build Docker Images - CUDA finished with conclusion: $CONCLUSION — skipping tests"
                echo "should_test=false" >> $GITHUB_OUTPUT
              fi
              exit 0
            fi

            echo "Build still running (status: $STATUS) — waiting ${WAIT_INTERVAL}s ($i/$WAIT_MAX)"
            sleep $WAIT_INTERVAL
          done

          echo "Timed out waiting for Build Docker Images - CUDA — skipping tests"
          echo "should_test=false" >> $GITHUB_OUTPUT

  run_tests:
    needs: [wait_for_image_build]
    if: always() && needs.wait_for_image_build.outputs.should_test == 'true'
    # Package manager and environment settings are read from .github/configs/cuda.yml
    uses: ./.github/workflows/all_tests_common.yml
    with:
      platform: cuda

  all_tests:
    needs: [run_tests]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify workflow status
        run: |
          if [ "${{ needs.run_tests.result }}" != "success" ]; then
            echo "❌ Tests workflow failed or were skipped"
            exit 1
          fi
          echo "✅ All tests passed!"
