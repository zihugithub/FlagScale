name: cuda_tests

on:
  push:
    branches: ["auto-build-image"]
  pull_request:
    branches: ["main"]
  # Auto-trigger after build_image_cuda completes (for non-PR builds like manual/push)
  workflow_run:
    workflows: ["Build Docker Images - CUDA"]
    types: [completed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.workflow_run.head_branch || github.ref }}-${{ github.actor }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Gate: decide whether to run tests or defer to workflow_run trigger
  #
  # - push / pull_request:
  #     Check if "Build Docker Images - CUDA" is also running for this commit.
  #     If found  → skip tests (workflow_run will trigger them after build finishes)
  #     If absent → run tests immediately
  #
  # - workflow_run:
  #     Build has finished → run tests only if it succeeded
  # ---------------------------------------------------------------------------
  wait_for_image_build:
    name: Check image build dependency
    runs-on: ubuntu-latest
    outputs:
      should_test: ${{ steps.check.outputs.should_test }}
    steps:
      - name: Check and wait for image build if needed
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EVENT="${{ github.event_name }}"

          # ── workflow_run: build just finished, run tests if it succeeded ──
          if [ "$EVENT" = "workflow_run" ]; then
            CONCLUSION="${{ github.event.workflow_run.conclusion }}"
            if [ "$CONCLUSION" = "success" ]; then
              echo "Build Docker Images - CUDA succeeded — running tests"
              echo "should_test=true" >> $GITHUB_OUTPUT
            else
              echo "Build Docker Images - CUDA did not succeed (conclusion: $CONCLUSION) — skipping tests"
              echo "should_test=false" >> $GITHUB_OUTPUT
            fi
            exit 0
          fi

          # ── push / pull_request: check if build workflow is also triggered ──
          if [ "$EVENT" = "push" ]; then
            HEAD_SHA="${{ github.sha }}"
          else
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          fi

          # Brief grace period to let the build workflow start (they trigger simultaneously)
          POLL_INTERVAL=30
          MAX_CHECKS=4   # up to ~2 minutes

          for i in $(seq 1 $MAX_CHECKS); do
            RUN_INFO=$(gh run list \
              --workflow=build_image_cuda.yml \
              --commit="$HEAD_SHA" \
              --json status,conclusion \
              --jq '.[0]' 2>/dev/null || echo '{}')

            STATUS=$(echo "$RUN_INFO" | jq -r '.status // "not_found"')

            if [ "$STATUS" != "not_found" ]; then
              echo "Build Docker Images - CUDA detected (status: $STATUS) for SHA $HEAD_SHA"
              echo "Deferring tests to workflow_run trigger after build completes"
              echo "should_test=false" >> $GITHUB_OUTPUT
              exit 0
            fi

            if [ "$i" -lt "$MAX_CHECKS" ]; then
              echo "Build workflow not found yet — checking again in ${POLL_INTERVAL}s ($i/$MAX_CHECKS)"
              sleep $POLL_INTERVAL
            fi
          done

          echo "No Build Docker Images - CUDA workflow found — running tests immediately"
          echo "should_test=true" >> $GITHUB_OUTPUT

  run_tests:
    needs: [wait_for_image_build]
    if: always() && needs.wait_for_image_build.outputs.should_test == 'true'
    # Package manager and environment settings are read from .github/configs/cuda.yml
    uses: ./.github/workflows/all_tests_common.yml
    with:
      platform: cuda

  all_tests:
    needs: [run_tests]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify workflow status
        run: |
          if [ "${{ needs.run_tests.result }}" != "success" ]; then
            echo "❌ Tests workflow failed or were skipped"
            exit 1
          fi
          echo "✅ All tests passed!"
