name: Common All Tests - Ascend

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
        description: Platform name (e.g., ascend)

jobs:
  ascend_tests:
    defaults:
      run:
        shell: bash
    env:
      PROJECT_ROOT: /tmp/FlagScale
    runs-on: ubuntu-latest
    container:
      image: harbor.baai.ac.cn/flagscale/vllm-plugin-fl:v0.1.0-ascend-ci
      ports:
        - 80
      volumes:
        - /home/flagscale_cicd/flask/static:/workspace/report
        - /home/flagscale_cicd/flask/config:/workspace/config
        - /home/flagscale_cicd/docker/docker_build/docker_data:/home/gitlab-runner/data
        - /home/flagscale_cicd/docker/docker_build/docker_tokenizers:/home/gitlab-runner/tokenizers
        - /usr/local/Ascend/driver:/usr/local/Ascend/driver:ro
        - /usr/local/Ascend/add-ons:/usr/local/Ascend/add-ons:ro
        - /usr/local/sbin/npu-smi:/usr/local/sbin/npu-smi:ro
      options: >-
        --device /dev/davinci0
        --device /dev/davinci1
        --device /dev/davinci2
        --device /dev/davinci3
        --device /dev/davinci4
        --device /dev/davinci5
        --device /dev/davinci6
        --device /dev/davinci7
        --device /dev/davinci8
        --device /dev/davinci9
        --device /dev/davinci10
        --device /dev/davinci11
        --device /dev/davinci12
        --device /dev/davinci13
        --device /dev/davinci14
        --device /dev/davinci15
        --device /dev/davinci_manager
        --device /dev/devmm_svm
        --device /dev/hisi_hdc
        --privileged
        --ipc=host
        --network=host
        --shm-size=500g
        --user root
        --ulimit nofile=65535:65535

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false
          clean: true
          lfs: false
          submodules: false
          set-safe-directory: true

      - name: Set safe directory
        run: git config --global --add safe.directory $GITHUB_WORKSPACE

      - name: Setup FlagScale CLI
        run: |
          pip install . --no-build-isolation --root-user-action=ignore
          command -v flagscale || { echo "❌ FlagScale CLI not found"; exit 1; }
        timeout-minutes: 5

      - name: Run inference tests - qwen3 4b_tp2_ascend
        id: inference_qwen3
        run: |
          bash "$GITHUB_WORKSPACE/tests/test_utils/runners/run_tests.sh" \
            --platform "${{ inputs.platform }}" \
            --device "atlas300i" \
            --type functional \
            --task inference \
            --model qwen3 \
            --list 4b_tp2_ascend
          exit_code=$?
          echo "exit_code=$exit_code" >> $GITHUB_OUTPUT
          exit $exit_code
        timeout-minutes: 30

      - name: Upload inference test logs
        if: always() && steps.inference_qwen3.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: inference-logs-${{ github.run_id }}-qwen3
          path: ${{ github.workspace }}/tests/functional_tests/inference/qwen3/test_results
          retention-days: 7
          if-no-files-found: warn
