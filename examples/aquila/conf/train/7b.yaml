system:
  tensor_model_parallel_size: 2
  pipeline_model_parallel_size: 2
  disable_bias_linear: True
  use_flash_attn: True
  use_distributed_optimizer: True
  precision:
    fp16: True
    initial_loss_scale: 522893
    min_loss_scale: 1.0
    attention_softmax_in_fp32: True
    accumulate_allreduce_grads_in_fp32: True
  logging:
    log_interval: 1
    tensorboard_log_interval: 1
    wandb_project: "train-aquila-7B"
    wandb_exp_name: "train-test-7B"
  checkpoint:
    save_interval: 2000

model:
  te_fl_prefer: vendor
  num_layers: 32
  hidden_size: 4096
  num_attention_heads: 32
  seq_length: 2048
  max_position_embeddings: 2048
  norm_epsilon: 1e-5
  use_rotary_position_embeddings: true
  no_position_embedding: true
  swiglu: true
  multiple_of: 256
  normalization: RMSNorm
  # rotary_interleaved_patch: true
  untie_embeddings_and_output_weights: true
  init_method_std: 0.02
  attention_dropout: 0.0
  hidden_dropout: 0.0
  weight_decay: 0.1
  clip_grad: 1.0
  train_samples: 1002539063
  eval_iters: 0
  micro_batch_size: 2
  global_batch_size: 32
  seed: 1234

  optimizer:
    weight_decay: 0.1
    adam_beta1: 0.9
    adam_beta2: 0.95
    lr_scheduler:
      lr: 2.0e-5
      min_lr: 2.0e-6
      lr_warmup_samples: 3076172
      lr_decay_style: cosine

data:
  reset_position_ids: True
  reset_attention_mask: True
  # data_path: /share/project/lixianduo/demo_data/pile/pile_wikipedia_demo
  data_path: /share/project/lizhiyu/hetero_data/HQ_wo_fim/Nemotron-CC-high-actual-actual-high_text_document
  split: 1
  no_mmap_bin_files: true
  tokenizer:
    legacy_tokenizer: true
    tokenizer_type: QwenTokenizerFS
    tokenizer_path: /share/project/lixianduo/qwentokenizer
    vocab_size: 151851
    make_vocab_size_divisible_by: 64
