use_benchmark: true # Throughput multiple run tests, Defalut: false
num_runs: 10 # Set throughput test frequency, default: 3

llm:
  model: /home/gitlab-runner/data/Qwen3-4B
  tokenizer: /home/gitlab-runner/data/Qwen3-4B
  trust_remote_code: true
  tensor_parallel_size: 2
  pipeline_parallel_size: 1
  gpu_memory_utilization: 0.9
  seed: 1234
  enforce_eager: true

generate:
  prompts_file: prompts.yaml
  sampling:
    top_p: 0.95
    top_k: 50
    temperature: 0.8
    max_tokens: 100 # Set the max number of tokens
    seed: 1234
