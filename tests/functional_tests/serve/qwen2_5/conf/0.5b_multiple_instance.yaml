defaults:
  - envs: cuda
  - _self_
  - serve: 0.5b_multiple_instance

experiment:
  exp_name: qwen2_5
  exp_dir: tests/functional_tests/serve/qwen2_5/test_results/0.5b_multiple_instance
  task:
    type: serve
    entrypoint: null
  runner:
    docker: ds
    ssh_port: 22
    nnodes: 1
    nproc_per_node: 2
    deploy:
      port: 6702
      use_fs_serve: true
  auto_tuner:
    space:
      tensor_model_parallel_size: [1]
      pipeline_model_parallel_size: [1]
      instance: [2]
      block_size: [16]
      max_num_batched_tokens: [512]
      max_num_seqs: [128]
    control:
      interval: 20
      run_best: false
  envs:
    RAY_DEDUP_LOGS: 0

action: auto_tune

hydra:
  run:
    dir: ${experiment.exp_dir}/hydra
