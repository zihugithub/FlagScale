defaults:
  - envs: cuda
  - _self_
  - serve: multiple_model

experiment:
  exp_name: multiple_model
  exp_dir: tests/functional_tests/serve/utils/models
  task:
    type: serve
    entrypoint: null
  runner:
    deploy:
      port: 6701
      use_fs_serve: true
      enable_composition: true
      name: /generate
      request:
        - arg: prompt
          type: str
        - arg: system_prompt
          type: Optional[str]
          required: false
          default: "You are a helpful assistant."

action: run

hydra:
  run:
    dir: ${experiment.exp_dir}/hydra
