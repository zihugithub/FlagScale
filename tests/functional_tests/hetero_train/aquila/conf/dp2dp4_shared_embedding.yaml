defaults:
  - envs: cuda
  - _self_
  - train: dp2dp4_shared_embedding

experiment:
  exp_name: dp2dp4_shared_embedding
  exp_dir: tests/functional_tests/hetero_train/aquila/test_results/dp2dp4_shared_embedding
  task:
    type: train
    backend: megatron
    entrypoint: flagscale/train/megatron/train_gpt.py
  runner:
    ssh_port: null
  shell_cmds: null
  envs:
    CUDA_VISIBLE_DEVICES: "0,1,2,3,4,5"
action: run

hydra:
  run:
    dir: ${experiment.exp_dir}/hydra
